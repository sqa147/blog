<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · MiniBlog</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a href="/" class="brand">MiniBlog</a>
    <div class="links" id="nav-links"></div>
  </nav>

  <main>
    <div class="card">
      <h1>Create your account</h1>
      <div id="error" class="error"></div>
      <form id="signup-form">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="30" />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password (min 6 chars)</label>
        <input type="password" id="password" required minlength="6" />

        <button type="submit" class="primary">Sign up</button>
      </form>
      <p class="muted-link">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/';

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const { token, user } = await api('/api/auth/signup', {
          method: 'POST',
          body: { username, email, password },
        });
        Auth.set(token, user);
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
