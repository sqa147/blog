<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · MiniBlog</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a href="/" class="brand">MiniBlog</a>
    <div class="links" id="nav-links"></div>
  </nav>

  <main>
    <div class="card">
      <h1>Log in</h1>
      <div id="error" class="error"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <label class="checkbox-row">
          <input type="checkbox" id="remember-me" />
          <span>Remember me</span>
        </label>

        <button type="submit" class="primary">Log in</button>
      </form>
      <p class="muted-link">Don't have an account? <a href="/signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      try {
        const { token, user } = await api('/api/auth/login', {
          method: 'POST',
          body: { email, password, rememberMe },
        });
        Auth.set(token, user, rememberMe);
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
